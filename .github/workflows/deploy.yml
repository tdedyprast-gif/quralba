name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: qurban

jobs:
  # ──────────────────────────────────────────────
  # Gate: require CI to pass first
  # ──────────────────────────────────────────────
  ci-check:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Docker images"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  # ──────────────────────────────────────────────
  # Build & push images to GHCR
  # ──────────────────────────────────────────────
  build-and-push:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Extract metadata (tags, labels)
      - name: Docker meta — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Docker meta — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      # Build & push backend (production Dockerfile)
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: qurban-system/backend
          file: qurban-system/backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & push frontend (production Dockerfile)
      # VITE_API_URL kosong → frontend pakai relative URL via Nginx reverse proxy
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: qurban-system/frontend
          file: qurban-system/frontend/Dockerfile.prod
          push: true
          build-args: VITE_API_URL=""
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy to VPS via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/qurban-system/qurban-system' }}"
            cd "$DEPLOY_PATH"

            echo "=== Pull latest images ==="
            docker compose -f docker-compose.prod.yml pull

            echo "=== Rolling restart: backend first ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            sleep 5

            echo "=== Backend health check ==="
            # Health check via internal network (frontend container can reach backend)
            docker compose -f docker-compose.prod.yml exec -T frontend \
              wget -qO- http://backend:8004/api/health || {
                echo "❌ Backend health check failed"
                docker compose -f docker-compose.prod.yml logs --tail=50 backend
                exit 1
              }
            echo "✅ Backend healthy"

            echo "=== Restart frontend ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend
            sleep 3

            echo "=== Frontend proxy check ==="
            curl -sf http://localhost:3000/api/health > /dev/null || {
              echo "❌ Frontend proxy check failed"
              docker compose -f docker-compose.prod.yml logs --tail=50 frontend
              exit 1
            }
            echo "✅ Frontend proxy OK"

            echo "=== Cleanup old images ==="
            docker image prune -f

            echo "=== Final status ==="
            docker compose -f docker-compose.prod.yml ps

            echo "🎉 Deployment complete: ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed for sha ${{ github.sha }}"
          echo "Check SSH logs above for details"
