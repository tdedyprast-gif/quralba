name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Gate: require CI to pass first
  # ──────────────────────────────────────────────
  ci-check:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Docker images"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  # ──────────────────────────────────────────────
  # Build & push images to GHCR
  # ──────────────────────────────────────────────
  build-and-push:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: qurban-system/backend
          file: qurban-system/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/qurban-backend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/qurban-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: qurban-system/frontend
          file: qurban-system/frontend/Dockerfile
          push: true
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL || 'https://api.qurban.local' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/qurban-frontend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/qurban-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy to server via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '/opt/qurban' }}

            # Pull latest images
            docker compose pull

            # Rolling restart: backend first, then frontend
            docker compose up -d --no-deps --build backend
            sleep 3
            curl -sf http://localhost:8080/api/health || { echo "Backend health check failed"; docker compose logs --tail=50 backend; exit 1; }

            docker compose up -d --no-deps --build frontend
            sleep 2
            curl -sf http://localhost:3000/ > /dev/null || { echo "Frontend health check failed"; docker compose logs --tail=50 frontend; exit 1; }

            echo "Deployment complete."
            docker compose ps

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Deployment failed — check SSH logs above"
          echo "Server: ${{ secrets.DEPLOY_HOST }}"
          echo "Sha: ${{ github.sha }}"
