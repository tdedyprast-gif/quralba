# ============================================
# docker-compose.dev.yml — Development
# Hot reload, bind mount, debug ports terbuka
# ============================================

services:
  db:
    image: postgres:16-alpine
    container_name: qurban_db_dev
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"  # PostgreSQL bisa diakses dari host untuk debugging
    volumes:
      - qurban_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: qurban_backend_dev
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASS: ${ADMIN_PASS}
      DOIT_API_KEY: ${DOIT_API_KEY}
      DOIT_BASE_URL: ${DOIT_BASE_URL}
      DOIT_WEBHOOK_SECRET: ${DOIT_WEBHOOK_SECRET}
    ports:
      - "8004:8004"       # API server
      - "2345:2345"       # Delve debugger (opsional)
    volumes:
      - ./backend:/src       # Bind mount source code untuk hot reload
      - qurban_uploads_dev:/app/uploads
    # Override CMD untuk development mode
    command: ["CompileDaemon", "-build=go build -o /tmp/server ./cmd", "-command=/tmp/server", "-directory=.", "-exclude-dir=.git", "-exclude-dir=uploads", "-color=true"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: qurban_frontend_dev
    depends_on:
      - backend
    ports:
      - "5173:5173"       # Vite dev server
      - "24678:24678"     # HMR WebSocket
    volumes:
      - ./frontend:/app    # Bind mount source code
      - /app/node_modules  # Anonymous volume untuk node_modules (jangan overwrite dari host)
    environment:
      - VITE_API_URL=http://localhost:8004
    # Override CMD untuk dev mode
    command: ["yarn", "dev", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  qurban_pg_dev:
  qurban_uploads_dev:
